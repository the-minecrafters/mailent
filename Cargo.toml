[workspace]
members = [
    "apps/core",
    "apps/sensor",
    "apps/probe",
    "apps/cli",
    "crates/domain",
    "crates/events",
    "crates/policy",
    "crates/correlation",
    "crates/baseline",
    "crates/storage",
    "crates/decision",
    "crates/integrations",
    "crates/reporting",
    "crates/scanner",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "GPL-3.0"
authors = ["Mailent Contributors"]
repository = "https://github.com/the-minecrafters/mailent"

[workspace.dependencies]
# Internal workspace crates
mailent-domain = { path = "crates/domain" }
mailent-events = { path = "crates/events" }
mailent-policy = { path = "crates/policy" }
mailent-correlation = { path = "crates/correlation" }
mailent-baseline = { path = "crates/baseline" }
mailent-storage = { path = "crates/storage" }
mailent-decision = { path = "crates/decision" }
mailent-integrations = { path = "crates/integrations" }
mailent-reporting = { path = "crates/reporting" }
mailent-scanner = { path = "crates/scanner" }

# Async & Runtime
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"

# HTTP Server & Middleware
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Observability & Errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"

# Common Identifiers & Times
uuid = { version = "1.13", features = ["v4", "v5", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

# Database & Storage
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "time", "json", "migrate", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"

# Protobuf
prost = "0.13"
