name: mailent
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mailent
      POSTGRES_USER: mailent
      POSTGRES_PASSWORD: mailent_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailent -d mailent"]
      interval: 5s
      timeout: 3s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: mailent
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mailent
      MINIO_ROOT_PASSWORD: mailent_dev_password
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  core:
    build:
      context: ../..
      dockerfile: deploy/compose/core.Dockerfile
    environment:
      MAILENT_CORE_HOST: 0.0.0.0
      MAILENT_CORE_PORT: 8080
      MAILENT_CORE_LOG_LEVEL: info
      MAILENT_DATABASE_URL: postgres://mailent:mailent_dev_password@postgres:5432/mailent
      MAILENT_CLICKHOUSE_URL: http://clickhouse:8123
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    build:
      context: ../..
      dockerfile: deploy/compose/web.Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      core:
        condition: service_healthy

  # Optional broker only. No distributed transport adapter is implemented yet.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.1
    profiles: [distributed]
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
    ports:
      - "127.0.0.1:19092:19092"

