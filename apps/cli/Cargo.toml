[package]
name = "mailent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "mailent"
path = "src/main.rs"

[dependencies]
mailent-domain = { workspace = true }
mailent-sensor = { path = "../sensor" }
mailent-scanner = { workspace = true }
mailent-policy = { workspace = true }
mailent-correlation = { workspace = true }
mailent-reporting = { workspace = true }
mailent-integrations = { workspace = true }
mailent-probe = { path = "../probe" }

clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
sha2 = "0.10"
tempfile = "3"
